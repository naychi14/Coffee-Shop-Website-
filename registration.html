<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Boutique - Registration Form</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <div class="logo">
      <img src="images/coffee_logo.png" alt="Bean Boutique Logo">
      <span class="site-name">Bean Boutique</span>
    </div>
  </header>
  <!-- Navigation Bar -->
  <nav>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li class="dropdown">
        <a href="coffee.html">Coffee ▾</a>
        <ul class="dropdown-content">
          <li><a href="Latte.html">Latte</a></li>
          <li><a href="Americano.html">Americano</a></li>
          <li><a href="Mocha.html">Mocha</a></li>
        </ul>
      </li>
      <li><a href="blend.html">Coffee Blend</a></li>
      <li><a href="brewing.html">Brewing Equipment</a></li>
      <li><a href="events.html">Events & Workshops</a></li>
      <li><a href="cart.html">Shopping Cart</a></li>
      <li><a href="offers.html">Special Offers</a></li>
    </ul>
  </nav>

  <main>
    <div class="registration-form">
      <h2>Register for an Event</h2>
      <form id="registrationForm">
        <label for="fname">First Name:</label>
        <input type="text" aria-label="To enter the First Name" id="fname" name="First Name" required><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" aria-label="To enter the Last Name" id="lname" name="Last Name" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" aria-label="To enter the Email" id="email" name="Email" required><br><br>

        <label for="message">Leave any questions you have: </label>
        <textarea id="message" aria-label="To enter the message" name="message" rows="3"
          placeholder="..."></textarea><br><br>

        <button type="submit">Submit</button>
      </form>
    </div>
  </main>

  <!-- Success message popup -->
  <div id="successMessage">
    ✅ Registration successful! Thank you.
  </div>

  <footer>
    <p>&copy; 2025 Bean Boutique. All rights reserved.</p>
  </footer>

  <!-- Inline JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("registrationForm");
      const successMessage = document.getElementById("successMessage");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        // Show popup
        successMessage.classList.add("show");

        // Reset form
        form.reset();

        // Hide popup after 3 seconds
        setTimeout(() => {
          successMessage.classList.remove("show");
        }, 3000);
      });
    });
  </script>

  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");
    const dropdowns = document.querySelectorAll(".dropdown > a");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });

    // make dropdowns expandable on small screens
    dropdowns.forEach(link => {
      link.addEventListener("click", (e) => {
        if (window.innerWidth <= 768) {
          e.preventDefault(); // stop direct link navigation
          link.parentElement.classList.toggle("open");
        }
      });
    });
  </script>

</body>

</html>
