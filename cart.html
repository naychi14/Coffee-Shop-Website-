<html lang="en">

<head>

<body>
  <header>
    <div class="logo">
      <img src="images/coffee_logo.png" alt="Bean Boutique Logo">
      <span class="site-name">Bean Boutique</span>
    </div>
  </header>

    <!-- Navigation Bar -->
    <nav>
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <ul id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li class="dropdown">
                <a href="coffee.html">Coffee ▾</a>
                <ul class="dropdown-content">
                    <li><a href="Latte.html">Latte</a></li>
                    <li><a href="Americano.html">Americano</a></li>
                    <li><a href="Mocha.html">Mocha</a></li>
                </ul>
            </li>
            <li><a href="blend.html">Coffee Blend</a></li>
            <li><a href="brewing.html">Brewing Equipment</a></li>
            <li><a href="events.html">Events & Workshops</a></li>
            <li><a href="cart.html">Shopping Cart</a></li>
            <li><a href="offers.html">Special Offers</a></li>
        </ul>
    </nav>

  <main>
    <h1>Shopping Cart</h1>
    <div class="cart-items" id="cart-items"></div>
    <h3 id="total">Total</h3>
    <button id="checkout">Proceed to Checkout</button>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cartContainer = document.getElementById("cart-items");
      const totalEl = document.getElementById("total");
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function updateCartDisplay() {
        cartContainer.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
          cartContainer.innerHTML = "<p>Your cart is empty.</p>";
          totalEl.innerText = "";
          return;
        }

        cart.forEach((item, index) => {
          total += item.price * item.quantity;

          const div = document.createElement("div");
          div.classList.add("cart-item");
          div.innerHTML = `
          <h2>${item.name}</h2>
          <p>
            Quantity: 
            <button class="qty-btn" data-index="${index}" data-action="minus">-</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" data-index="${index}" data-action="plus">+</button>
          </p>
          <p>Price: $${(item.price * item.quantity).toFixed(2)}</p>
          <button class="remove-btn" data-index="${index}">🗑 Remove</button>
        `;
          cartContainer.appendChild(div);
        });

        totalEl.innerText = `Total: $${total.toFixed(2)}`;
        localStorage.setItem("cart", JSON.stringify(cart));
      }

      // Event listener for +, -, and remove
      cartContainer.addEventListener("click", (e) => {
        const index = e.target.dataset.index;

        if (e.target.classList.contains("qty-btn")) {
          const action = e.target.dataset.action;
          if (action === "plus") {
            cart[index].quantity += 1;
          } else if (action === "minus" && cart[index].quantity > 1) {
            cart[index].quantity -= 1;
          }
        }

        if (e.target.classList.contains("remove-btn")) {
          cart.splice(index, 1);
        }

        updateCartDisplay();
      });

      // Checkout button
      document.getElementById("checkout").addEventListener("click", () => {
        alert("Proceeding to checkout...");
      });

      // Initial load
      updateCartDisplay();
    });
  </script>

          <script>
            const menuToggle = document.getElementById("menu-toggle");
            const navLinks = document.getElementById("nav-links");
            const dropdowns = document.querySelectorAll(".dropdown > a");

            menuToggle.addEventListener("click", () => {
                navLinks.classList.toggle("show");
            });

            // make dropdowns expandable on small screens
            dropdowns.forEach(link => {
                link.addEventListener("click", (e) => {
                    if (window.innerWidth <= 768) {
                        e.preventDefault(); // stop direct link navigation
                        link.parentElement.classList.toggle("open");
                    }
                });
            });
        </script>

  <footer>
    <p>&copy; 2025 Bean Boutique. All rights reserved.</p>
  </footer>
</body>

</html>
